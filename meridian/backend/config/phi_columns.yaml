# PHI columns configuration
# Derived from the production masking script.
#
# Rules:
#   - get_current_value() masks these to '<PHI>' — never appears in SQL output
#   - generate.py blocks SET clauses targeting these columns
#
# To add a new PHI field: add its column_name under the relevant table.
# Column names are matched case-insensitively.
#
# Format:
#   table_name:
#     - column_name

member:
  - first_name
  - last_name
  - middle_name
  - date_of_birth
  - date_of_death
  - ssn
  - unmasked_ssn
  - duplicate_ssn
  - medicare_no
  - medicaid_no
  - historical_hicn
  - subscriber_id
  - ext_id
  - st_subscriber_id

member_eligibility:
  - medicareno
  - medicaid
  - ssn
  - subscriber_id

member_address:
  - first_name
  - last_name
  - address_1
  - address_2
  - city
  - zip
  - email
  - phone
  - fax
  - longitude
  - latitude

patientcontactdetail:
  - CONTACTNUMBEREMAIL
  - CONTACTLASTNAME
  - CONTACTFIRSTNAME

provider:
  - FIRST
  - LAST
  - npi
  - prov_id
  - fedaral_tax_id
  - federal_tax_id

provider_address:
  - address_1
  - address_2
  - city
  - zip
  - fax

