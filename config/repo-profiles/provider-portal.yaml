# CURATED (human-authored). Preserved verbatim across regeneration.
#
# Summary: `provider-portal` (cp-provider-portal) is the external-provider-
# facing web portal used by healthcare providers to interact with MHK — a
# multi-module Spring MVC / Spring Security Java EE web app using an
# Action-pattern servlet (ServiceController → ActionExecutor → Action impl).
# Authenticated via SAML SSO / CAS. Providers use it to manage their own
# account, search members, submit and check prior authorizations, upload
# clinical documentation, and view authorization decisions. Includes
# significant offline / CMOffline assessment functionality for providers
# operating without network connectivity.
#
# Typical ticket vocabulary: provider portal, provider login, provider sso,
# saml, cas, provider account, provider dashboard, provider authorization
# submission, provider upload, provider fax attach, offline assessment,
# CMOffline, offline client, provider search, provider-facing UI, web
# portal, portal user, session expiration, SSO login.
# --------------------------------------------------------------------------
