# --------------------------------------------------------------------------
# CURATED (human-authored). Preserved verbatim across regeneration.
#
# Summary: `core-app` is the Care Prominence Medical Management monorepo —
# the primary UI and server platform for MHK. ~1.6M lines of Java across
# ~12 Maven modules. Owns Utilization Management (authorizations, denials,
# appeals, grievances), Care Management (case workspace, careplan,
# assessments, member 360), and the GWT / SmartGWT browser UI and web
# services (REST + SOAP). This is where most business logic tickets land:
# authorization intake, member search, provider/member contract status,
# correspondence template rendering, case lifecycle, reporting stored
# procedures, Flyway migrations, and the MHK FHIR server (mhk-fhir-server
# submodule) for the MedHOK FHIR facade.
#
# Typical ticket vocabulary: authorization, auth intake, appeal, grievance,
# care plan, care management, case workspace, member search, member banner,
# provider, contract status, eligibility, GWT, SmartGWT, hibernate,
# NativeSQL, RX claim, pharmacy claim, PART C / Part D denial, IRE, MD
# review, assessment, utilization management, denial, approval, draft, RxClaim.
# --------------------------------------------------------------------------
