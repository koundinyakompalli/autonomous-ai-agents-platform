# --------------------------------------------------------------------------
# CURATED (human-authored). Preserved verbatim across regeneration.
#
# Summary: `batch-jobs` (cp-batch-monorepo) is the Care Prominence background-
# processing monorepo — ~70 independent batch modules spanning inbound intake
# (fax, email, OCR), correspondence generation and tracking, outbound case
# processing, EDI (X12 278 prior-auth, 834/837), EPA (Electronic Prior
# Authorization) schedulers, workflow/BPM monitoring, assessment/census/member
# loaders, and customer-specific variants (CVS, WellCare, Centene, etc).
# These are standalone Java jobs — each module is its own `Main.java` +
# POM — orchestrated by schedulers or SQS triggers, not part of the main
# Care Prominence web app.
#
# Typical ticket vocabulary: fax intake, fax not transferring, fax queue,
# barcoded fax, TIFF, OCR, correspondence not generating, letter not
# generating, letter print, print queue, case not routing, EPA, X12 278,
# EDI, 834, 837, WellCare appeals correspondence, CVS correspondence,
# centene file, batch job failure, scheduled job, outbound case, effectuation,
# assessment loader, census loader, MTM, correspondence watcher,
# FaxMetaDataProcessor, vendor batch, CMS processor.
# --------------------------------------------------------------------------
