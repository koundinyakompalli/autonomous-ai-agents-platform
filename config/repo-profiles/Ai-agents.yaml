# Summary:
# Enterprise AI Agent Platform is a Java 21 / Spring Boot healthcare AI SaaS
# platform hosted on AWS. It contains orchestration core services, MCP servers,
# controller agents, processing agents, shared Java/Python SDK libraries,
# Terraform infrastructure, and a React/Vite portal. OneShot support for this
# repo must preserve the platform's healthcare safety rules: controllers make
# orchestration decisions, processing agents execute only, PHI must not be
# logged, security failures fail closed, production service-to-service traffic
# uses HTTPS through ALB/cert patterns, AWS changes stay in Terraform/IaC, and
# all changes go through PR review with focused tests.
