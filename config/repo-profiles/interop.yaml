# --------------------------------------------------------------------------
# CURATED (human-authored). Preserved verbatim across regeneration.
#
# Summary: `interop` is the FHIR/interoperability monorepo. It owns all
# external-facing FHIR APIs for the Care Prominence platform: CDS Hooks
# (order-sign, order-select, order-dispatch), DTR (Documentation Templates
# and Rules), PAS (Prior Authorization Support), SMART on FHIR app launch,
# the OLTP->FHIR transformation pipeline, and ingestion into AWS HealthLake.
# Written primarily in Java (mhk-interopt-fhirhelper SpringBoot ECS service)
# with supporting Python Lambdas (fhir_processor, health_lake_exporter,
# healthlake_events, smart_introspection, sqs_api_facade).
#
# Typical ticket vocabulary: FHIR, CDS hook, DTR, CRD, PAS, order-sign,
# order-select, order-dispatch, questionnaire-package, Interqual, MCG,
# Coverage, HealthLake, SMART launch, MHK Internal Assessments, external
# DTR provider, Coverage Requirements Discovery, Prior Auth Support, PA List.
# --------------------------------------------------------------------------
