# --------------------------------------------------------------------------
# CURATED (human-authored). Preserved verbatim across regeneration.
#
# Summary: `client-services` (cp-client-services-monorepo) is the client /
# customer integration layer — 44+ Maven modules implementing the
# ExternalCallout interface for specific payers, PBMs, health plans, and
# third-party integrations. Each `mm-service-<Customer>` module owns the
# vendor-specific SOAP/REST/FHIR adapter, authentication, and payload
# mapping for a single external client. Core shared libraries are
# ExternalClientServicesModel (DAOs/models) and ExternalClientRestServices
# (REST framework). Tickets here are typically customer-prefixed
# ("BCBSMA |", "CVS |", "Cigna |", "Humana |") and describe a client-specific
# integration defect, API mapping change, or authentication problem.
#
# Supported customers (primary keyword-to-repo signal):
# Aetna, Cigna, Humana, Wellcare, WellCare, BCBSMA, BCBSNC, BCBSTN, BSCA,
# Tufts, CVS, CVS-PBM, Abarca, ESI, Medimpact, Magellan, Tredium,
# CareSource, Evolent, HPartners, HPSM, HNE, IEHP, Rightway, Aultcare,
# MCS, OneHome, UPHP, ArgusLegacy, Leon, MarketProminance, Gateway,
# withme, withMe, Humana EMME fax integration.
#
# Typical ticket vocabulary: client, customer-specific, vendor integration,
# external callout, PBM, payer, pharmacy benefit manager, claims feed,
# auth submission, client fax, customer-specific mapping, client API
# authentication, client oauth, externalcallout, onehome, onecare,
# ExternalClientRestServices, ExternalClientServicesModel.
# --------------------------------------------------------------------------
