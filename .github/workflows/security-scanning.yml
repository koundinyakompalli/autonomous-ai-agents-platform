name: Security / Trivy and Checkov

on:
  push:
    branches: [main, master]
    paths:
      - "Dockerfile*"
      - "dashboard/Dockerfile"
      - "terraform/**"
      - "package.json"
      - "package-lock.json"
      - "dashboard/package.json"
      - "dashboard/package-lock.json"
      - "**/requirements.txt"
      - ".trivyignore"
      - ".github/workflows/security-scanning.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "Dockerfile*"
      - "dashboard/Dockerfile"
      - "terraform/**"
      - "package.json"
      - "package-lock.json"
      - "dashboard/package.json"
      - "dashboard/package-lock.json"
      - "**/requirements.txt"
      - ".trivyignore"
      - ".github/workflows/security-scanning.yml"
  schedule:
    - cron: "17 9 * * 2"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  trivy:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: HIGH,CRITICAL
          vuln-type: os,library
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        if: always() && hashFiles('trivy-fs.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-filesystem

  checkov:
    name: Checkov IaC and secrets scan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Checkov
        run: python -m pip install --upgrade pip checkov

      - name: Run Checkov
        run: |
          checkov \
            --directory terraform \
            --file Dockerfile.worker \
            --file Dockerfile.orchestrator \
            --file Dockerfile.oneshot \
            --file Dockerfile.harvey \
            --file Dockerfile.spec-factory \
            --file Dockerfile.compose-markitdown \
            --file dashboard/Dockerfile \
            --framework terraform,dockerfile,secrets \
            --soft-fail \
            --compact \
            --output cli \
            --output sarif \
            --output-file-path console,checkov.sarif

      - name: Upload Checkov SARIF
        if: always() && hashFiles('checkov.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: checkov.sarif
          category: checkov-iac
